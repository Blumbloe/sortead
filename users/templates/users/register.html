{% extends 'layout.html' %}

{% block title %}
    Register a new User
{% endblock %}

{% block content %}
    <h1>Register a New User</h1>
    <form class="form-with-validation" action="{% url 'users:register' %}" method="post">
        {% csrf_token %}
        {{ form }}
        <button class="form-submit btn custom-button-outline d-block mx-auto">Submit</button>
    </form>
{% endblock %}
